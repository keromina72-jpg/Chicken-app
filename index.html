<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مزرعة الفراخ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8731a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المزرعة">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--or:#e8731a;--od:#b9560a;--ol:#fff1e3;--bg:#fffaf5;--card:#fff;--tx:#2b2118;--mu:#8a7767;--bd:#f1dfcf;--ok:#2e8b57;--bad:#c62828;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;padding-top:env(safe-area-inset-top,0px)}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:#fff;border-left:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:20px;color:var(--od);padding:4px 10px 16px}
#nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;margin-bottom:4px;border:0;border-radius:12px;background:none;color:var(--tx);font:inherit;text-align:right;cursor:pointer}
#nav button.on{background:var(--ol);color:var(--od);font-weight:800}
#nav b{font-size:20px}
main{padding:16px;max-width:1040px;width:100%;margin:auto}
#hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
#hd h1{margin:0;font-size:20px;font-weight:800;color:var(--od)}
.pill{background:var(--ol);color:var(--od);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600}
h2{font-size:17px;margin:0 0 10px;font-weight:800}h3{font-size:15px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(185,86,10,.06)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
input,select{padding:10px;border-radius:10px;border:1px solid var(--bd);background:#fff;color:var(--tx);font:inherit;width:100%}
input:focus,select:focus{outline:2px solid var(--or);border-color:var(--or)}
button{font:inherit;cursor:pointer}
.pri{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,#f58a2e,var(--or));color:#fff;font-weight:800}
.sec{margin-top:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--or);background:#fff;color:var(--od);font-weight:600}
.x{border:0;background:none;color:var(--bad);font-size:16px}
.r{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:8px}
.mr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--bd)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600;background:var(--bg)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mu{color:var(--mu)}
.hi{background:var(--ol);font-weight:800}
.big{font-size:22px;font-weight:800;color:var(--od);margin:4px 0}
.al{padding:10px 12px;border-radius:10px;margin-bottom:6px;font-size:14px;background:#f8f4ef}
.al.w{background:var(--ol);border-right:4px solid var(--or)}
.bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin-top:4px;width:100%}.bar i{display:block;height:100%;background:var(--or)}
#toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:9}
body.lo aside,body.lo #hd{display:none}body.lo #app{grid-template-columns:1fr}
#nav #moreb{display:none}#sheet{display:none}
@media(max-width:820px){
 #app{grid-template-columns:1fr}
 aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:5;border:0;border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
 .brand{display:none}#nav{display:flex}#nav .mo{display:none}#nav #moreb{display:flex}
 #nav button{flex-direction:column;gap:2px;font-size:11px;padding:7px 2px;flex:1;min-width:0;margin:0;text-align:center;justify-content:center}
 main{padding:12px 12px 96px}
 .cols{grid-template-columns:1fr}
}
#sheet{display:none}
@media(max-width:820px){#sheet.show{display:block;position:fixed;inset:0;z-index:6;background:rgba(43,33,24,.35)}
#sheet .sp{position:absolute;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:#fff;border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;box-shadow:0 8px 30px rgba(0,0,0,.22)}
#sheet .sp button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;border-radius:12px;padding:12px 4px;font-size:13px;color:var(--tx)}
#sheet .sp button.on{background:var(--ol);color:var(--od);font-weight:800}#sheet .sp b{font-size:24px}
aside{box-shadow:0 -2px 12px rgba(185,86,10,.10)}}
.ph{display:none}
@media print{#sheet{display:none!important}aside,#hd,.noprint,#toast{display:none!important}#app{display:block}body{background:#fff}main{padding:0;max-width:none}.ph{display:block;font-weight:800;font-size:18px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #000}.card{box-shadow:none;break-inside:avoid;border:1px solid #ccc}td,th{white-space:normal}.cols{grid-template-columns:1fr}.sc{overflow:visible}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div id="app">
<aside><div class="brand">🐔 مزرعة الفراخ</div><div id="nav"></div></aside>
<main><div id="ph" class="ph"></div><div id="hd"></div><div id="view"></div></main>
</div>
<div id="sheet" onclick="if(event.target===this)toggleMore()"></div>
<div id="toast"></div>
<script>
/* ===== إعداد Firebase: الصق apiKey و appId من موقع الخرفان (نفس المشروع) =====
   لو apiKey فاضي الموقع بيشتغل محلي على نفس الجهاز بس (وضع تجريبي). */
const FB={apiKey:'AIzaSyAruaVgbRKXd3GG4FHqHD7ZrW6Oe6vUhnA',authDomain:'chicken-app-7f146.firebaseapp.com',projectId:'chicken-app-7f146',appId:'1:604227682076:web:3fa11e1bae5a882ad4c4d9'};
const CLOUD=!!FB.apiKey;

/* جدول الاستاندر: الوطنية مصر - روس، يوم 0 إلى 45 */
const W=[44,62,81,102,125,151,181,213,249,288,330,376,425,477,533,592,655,720,789,860,935,1012,1092,1174,1258,1345,1434,1524,1616,1710,1805,1901,1999,2097,2196,2296,2396,2496,2597,2697,2798,2898,2998,3097,3197,3295];
const C=[0,12,28,48,72,100,131,166,206,249,297,349,406,468,535,608,685,768,856,950,1050,1155,1266,1383,1505,1633,1767,1907,2051,2202,2357,2518,2684,2855,3031,3211,3396,3584,3777,3974,4175,4379,4586,4797,5010,5226];
/* مواعيد التحصين إرشادية، اتبع برنامج الدكتور البيطري */
const VAC=[[5,'هتشنر + IB'],[12,'جمبورو'],[18,'جمبورو (تقوية)'],[21,'لاسوتا (نيوكاسل)']];
const SK=['days','meds','chicks','vp'],PK=['exp','sales','pays','price','feedPrice','daily','feedBuy','cycles','wk','wl','ph'];

let S={days:[],meds:[],chicks:0,exp:[],sales:[],pays:[],price:0,feedPrice:0,daily:0,feedBuy:[],cycles:[],wk:[],wl:[],vp:null,ph:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('farm')||'{}'))}catch(e){}
let role='owner',tab='daily',auth,AU,db,fs,ref={};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseFloat(v)||0,f0=n=>Math.round(n).toLocaleString('en');
const today=()=>new Date().toISOString().slice(0,10);
const days=()=>S.days.slice().sort((a,b)=>a.n-b.n);
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const totExp=()=>sum(S.exp,x=>x.a)+laborDue();
let _tt;function toast(t,ms){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(_tt);_tt=setTimeout(()=>e.style.display='none',ms||2200)}

/* ---------- الحفظ والمزامنة ---------- */
async function save(){
 try{localStorage.setItem('farm',JSON.stringify(S))}catch(e){}
 if(!db)return;
 const pick=ks=>JSON.parse(JSON.stringify(Object.fromEntries(ks.map(k=>[k,S[k]===undefined?null:S[k]]))));
 try{await fs.setDoc(ref.sh,pick(SK),{merge:true});if(role=='owner')await fs.setDoc(ref.pr,pick(PK),{merge:true})}
 catch(e){console.error(e);toast('مشكلة في الحفظ: '+(e.code||e.message),6000);return false}
 return true
}
const soft=()=>{const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName))return;render()};
function listen(){
 const on=r=>fs.onSnapshot(r,s=>{if(s.metadata.hasPendingWrites||!s.exists())return;Object.assign(S,s.data());soft()});
 on(ref.sh);if(role=='owner')on(ref.pr);
}
async function boot(){
 if(!CLOUD){render();return}
 const B='https://www.gstatic.com/firebasejs/10.14.1/';
 let a,au,f;try{[a,au,f]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')])}catch(e){return offline()}
 const app=a.initializeApp(FB);AU=au;fs=f;auth=au.getAuth(app);db=f.getFirestore(app);
 ref.sh=f.doc(db,'poultry','shared');ref.pr=f.doc(db,'poultry','private');
 au.onAuthStateChanged(auth,async u=>{
  if(!u)return login();
  try{const r=await f.getDoc(f.doc(db,'users',u.uid));if(!r.exists())return login('الحساب ده لسه متفعّلش، كلم المالك');role=r.data().role=='owner'?'owner':'worker'}
  catch(e){return login('مشكلة في الصلاحيات')}
  listen();render();
 });
}
function offline(){document.body.classList.add('lo');$('#view').innerHTML=`<div class="card" style="max-width:380px;margin:40px auto"><h2>📡 مفيش اتصال</h2><p class="mu">الموقع محتاج نت عشان يفتح بياناتك ويحفظ. اتأكد من الاتصال وجرّب تاني.</p><button class="pri" onclick="location.reload()">إعادة المحاولة</button></div>`}
function login(msg){
 document.body.classList.add('lo');
 $('#view').innerHTML=`<div class="card" style="max-width:380px;margin:40px auto"><h2>🐔 دخول</h2>${msg?`<p class="bad">${msg}</p>`:''}<label>الإيميل<input id="le" type="email"></label><label style="margin-top:8px">الرقم السري<input id="lp" type="password"></label><button class="pri" onclick="doLogin()">دخول</button></div>`}
async function doLogin(){try{await AU.signInWithEmailAndPassword(auth,$('#le').value.trim(),$('#lp').value)}catch(e){toast('الإيميل أو الرقم السري غلط')}}
function logout(){AU.signOut(auth)}

/* ---------- الهيكل ---------- */
function go(t){tab=t;render()}
function toggleMore(){$('#sheet').classList.toggle('show')}
function render(){
 document.body.classList.remove('lo');
 const own=role=='owner';
 const tabs=[['daily','📝','اليومية'],['table','📊','الجدول'],['meds','🧪','الأدوية'],['stock','💊','المخزن']].concat(own?[['exp','💰','المصاريف'],['wk','👷','العاملين'],['sales','🧾','المبيعات'],['cycles','📈','التقارير']]:[]);
 if(!tabs.some(t=>t[0]==tab))tab='daily';
 const PRI=['daily','table','meds','stock','sales'],more=tabs.filter(t=>!PRI.includes(t[0]));
 $('#nav').innerHTML=tabs.map(t=>`<button class="${t[0]==tab?'on':''}${PRI.includes(t[0])?'':' mo'}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('')+(more.length?`<button id="moreb" class="${more.some(t=>t[0]==tab)?'on':''}" onclick="toggleMore()"><b>☰</b>المزيد</button>`:'');
 $('#sheet').innerHTML=`<div class="sp">${more.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('')}</div>`;$('#sheet').classList.remove('show');
 $('#hd').innerHTML=`<h1>${tabs.find(t=>t[0]==tab)[2]}</h1><div><span class="pill">${CLOUD?(own?'مالك':'مهندس'):'وضع تجريبي (محلي)'}</span>${CLOUD?' <button class="sec" style="margin:0" onclick="logout()">خروج</button>':''}</div>`;
 $('#view').innerHTML=({daily:vDaily,table:vTable,meds:vMeds,exp:vExp,wk:vWk,sales:vSales,stock:vStock,cycles:vCycles})[tab]();document.querySelectorAll('.mr').forEach(paint);
 $('#ph').innerHTML='🐔 مزرعة الفراخ — '+tabs.find(t=>t[0]==tab)[2]+' — '+today();
 scrollTo(0,0);
}

/* ---------- التنبيهات ---------- */
function feedLeft(){if(!S.feedBuy.length)return null;const left=sum(S.feedBuy,x=>x.k)-sum(S.days,e=>e.feed),r=days().slice(-3).filter(e=>e.feed),avg=r.length?sum(r,e=>e.feed)/r.length:0;return{left,days:avg?left/avg:99}}
function alerts(){
 const d=days(),A=[],L=d[d.length-1],cur=L?L.n+1:0;
 A.push(['i',`يوم ${cur}: العلف المناسب (${cur<=10?'بادئ':cur<=24?'نامي':'ناهي'}) — إرشادي حسب شركة العلف`]);
 if(cur==11||cur==25)A.push(['w',`النهاردة غيّر العلف لـ${cur==11?'نامي':'ناهي'}`]);
 if(cur==10||cur==24)A.push(['i',`بكرة تغيير العلف لـ${cur==10?'نامي':'ناهي'}`]);
 vplan().forEach(p=>{if(doneOf(p))return;const x=p.d-cur;if(x==0)A.push(['w','تحصين النهاردة: '+p.n]);else if(x>0&&x<=2)A.push(['i',`تحصين ${p.n} بعد ${x} يوم`]);else if(x<0&&x>=-3)A.push(['w',`تحصين ${p.n} فات ميعاده (يوم ${p.d}) — لو اتعمل علّم عليه تم`])});
 if(L&&S.chicks){
  const td=sum(d,e=>e.dead),alive=S.chicks-td,pv=d.slice(0,-1),av=pv.length?sum(pv,e=>e.dead)/pv.length:0,r=L.dead/(alive+L.dead);
  if(L.dead>0&&(r>.003||(L.dead>=3&&L.dead>2*av)))A.push(['w',`نافق يوم ${L.n} مرتفع: ${L.dead} (${(r*100).toFixed(2)}%) — شوف السبب`]);
  if(L.n>=2&&L.n<=45&&L.feed){const g=L.feed*1000/alive,sd=C[L.n]-C[L.n-1],dv=(g-sd)/sd;if(Math.abs(dv)>.15)A.push(['w',`علف يوم ${L.n}: ${f0(g)} جم/فرخة مقابل ${sd} استاندر (${dv>0?'+':''}${(dv*100).toFixed(0)}%)`])}
  if(L.w&&W[L.n]){const dv=(L.w-W[L.n])/W[L.n];if(dv<-.05)A.push(['w',`وزنك أقل من الاستاندر بـ ${(-dv*100).toFixed(0)}%`])}
  if(L.t){const[lo,hi]=trange(L.n);if(L.t<lo-1||L.t>hi+1)A.push(['w',`حرارة العنبر ${L.t}° — المناسب ليوم ${L.n}: ${lo} إلى ${hi}° (إرشادي)`])}
  if(L.h&&(L.h<40||L.h>75))A.push(['w',`الرطوبة ${L.h}% — المناسب حوالي 50 إلى 70%`]);
 }
 const fl=feedLeft();if(fl&&fl.days<3)A.push(['w',`العلف هيخلص بعد ~${fl.days.toFixed(1)} يوم (باقي ${f0(fl.left)} كجم)`]);
 S.meds.filter(m=>m.left<=m.q0*.2).forEach(m=>A.push(['w','دوا قليل: '+m.name]));
 return A}

/* ---------- اليومية ---------- */
const medRow=()=>{const has=S.meds.length>0;return `<div class="mr" data-man="${has?0:1}"><div class="mt" style="grid-column:1/-1;display:flex;gap:6px"><button type="button" class="sec mb0" style="margin:0;flex:1" onclick="mode(this,0)"${has?'':' disabled'}>📦 من المخزن</button><button type="button" class="sec mb1" style="margin:0;flex:1" onclick="mode(this,1)">✏️ يدوي</button></div><select class="ms">${S.meds.map(m=>`<option value="${m.id}">${esc(m.name)} (${f0(m.left)} ${m.u})</option>`).join('')}</select><select class="mw"><option value="1">سقوة 1</option><option value="2">سقوة 2</option><option value="3">سقوة 3</option></select><input class="mn" placeholder="اسم الدوا">
<select class="mu2"><option>مل</option><option>جرام</option></select><input class="mq" type="number" step="any" inputmode="decimal" placeholder="الكمية"></div>`};
function mode(b,man){const r=b.closest('.mr');r.dataset.man=man;paint(r)}
function paint(r){const man=r.dataset.man=='1';r.querySelector('.ms').style.display=man?'none':'';r.querySelector('.mn').style.display=r.querySelector('.mu2').style.display=man?'':'none';
 [['.mb0',!man],['.mb1',man]].forEach(([c,on])=>{const e=r.querySelector(c);e.style.background=on?'var(--or)':'#fff';e.style.color=on?'#fff':'var(--od)'})}
function addMed(){$('#meds').insertAdjacentHTML('beforeend',medRow());paint($('#meds').lastElementChild)}
function vDaily(){const d=days(),n=d.length?d[d.length-1].n+1:0;
return `<div class="cols"><div class="card"><h2>تسجيل اليوم</h2><div class="g">
<label>اليوم في الدورة<input id="fn" type="number" value="${n}"></label>
<label>التاريخ<input id="fd" type="date" value="${today()}"></label>
${(S.chicks&&S.days.length)?'':`<label>عدد الكتاكيت<input id="fc" type="number" inputmode="numeric" value="${S.chicks||''}"></label>`}
<label>العلف (كجم)<input id="ff" type="number" step="any" inputmode="decimal"></label>
<label>النافق<input id="fx" type="number" inputmode="numeric"></label>
<label>متوسط الوزن (جم) لو وزنت<input id="fw" type="number" step="any" inputmode="decimal"></label>
<label>حرارة العنبر (°م)<input id="ft" type="number" step="any" inputmode="decimal"></label>
<label>الرطوبة (%)<input id="fh" type="number" step="any" inputmode="decimal"></label>
<label>تحصين النهاردة (لو حصنت)<input id="fv" list="vl" placeholder="مثلاً: جمبورو"></label><datalist id="vl">${VAC.map(v=>`<option value="${v[1]}">`).join('')}</datalist></div>
<h3>الأدوية</h3><div id="meds">${medRow()}</div>
<button class="sec" onclick="addMed()">+ دوا تاني</button>
<button class="pri" onclick="saveDay()">حفظ اليوم</button></div>
<div class="card"><h2>تنبيهات</h2>${alerts().map(a=>`<div class="al ${a[0]}">${a[0]=='w'?'⚠️ ':''}${esc(a[1])}</div>`).join('')}</div>${vVac()}</div>`}
function rm(n){const o=S.days.find(x=>x.n==n);if(o){o.meds.forEach(a=>{const m=S.meds.find(x=>x.id==a.id);if(m)m.left+=a.q});S.days=S.days.filter(x=>x!==o)}}
function saveDay(){const n=parseInt($('#fn').value);if(isNaN(n)||n<0)return toast('اكتب رقم اليوم');
 if($('#fc'))S.chicks=num($('#fc').value);if(!S.chicks)return toast('اكتب عدد الكتاكيت');
 for(const r of document.querySelectorAll('.mr')){if(r.dataset.man=='1'&&r.querySelector('.mn').value.trim()&&num(r.querySelector('.mq').value)<=0)return toast('اكتب كمية الدوا: '+r.querySelector('.mn').value.trim(),4000)}
 const meds=[];document.querySelectorAll('.mr').forEach(r=>{const q=num(r.querySelector('.mq').value);if(q<=0)return;const v=r.querySelector('.ms').value,w=r.querySelector('.mw').value;
  if(r.dataset.man=='1'){const nm=r.querySelector('.mn').value.trim();if(nm)meds.push({name:nm,q,u:r.querySelector('.mu2').value,w,man:1})}
  else{const m=S.meds.find(x=>x.id==v);if(m){m.left=Math.max(0,m.left-q);meds.push({id:m.id,name:m.name,q,u:m.u,w})}}});
 rm(n);S.days.push({n,date:$('#fd').value||today(),feed:num($('#ff').value),dead:num($('#fx').value),w:num($('#fw').value),t:num($('#ft').value)||null,h:num($('#fh').value)||null,v:$('#fv').value.trim(),meds});

 let best=-1e15,bd=n;const out=[];
 for(let x=n;x<=45;x++){const w=W[x]*r,rev=N*w/1000*S.price,cost=t+(C[x]-C[n])*N/1000*S.feedPrice+(x-n)*S.daily;out.push({x,w,rev,cost,p:rev-cost});if(rev-cost>best){best=rev-cost;bd=x}}
 const b=out.find(o=>o.x==bd),be=t/(N*S.price)*1000;

 const row=(a,b,c)=>`<div class="li"><span>${a}</span><b class="${c||''}">${b}</b></div>`,N=S.chicks,sold=s.sk>0;
 return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">تقرير الدورة الحالية</h2><span class="noprint" style="white-space:nowrap"><button class="sec" style="margin:0" onclick="shareRep()">📲 واتساب</button> <button class="sec" style="margin:0" onclick="window.print()">🖨️ PDF</button></span></div>
<div class="cols" style="margin-top:12px"><div><h3>الإنتاج</h3>${row('الكتاكيت',f0(N))}${row('النافق',f0(s.dead)+' ('+s.mort.toFixed(1)+'%)')}${row('عمر آخر يوم مسجل',s.age+' يوم')}${row('متوسط الوزن',s.avgW?f0(s.avgW)+' جم':'—')}${row('علف مستهلك',f0(s.feed)+' كجم')}${row('معامل التحويل FCR',s.fcr?s.fcr.toFixed(2):'—')}${row('كفاءة الإنتاج EPEF',s.epef?f0(s.epef):'—')}</div>
<div><h3>الحسابات</h3>${row('إجمالي المصاريف',f0(s.cost))}${row('تكلفة الفرخة',N?(s.cost/N).toFixed(2):'—')}${row('تكلفة الكيلو',s.ckg?s.ckg.toFixed(2):'—')}${row('إجمالي المبيعات',f0(s.rev))}${row('متوسط سعر بيع الكيلو',sold?s.ap.toFixed(2):'—')}${sold?row('الصافي',f0(s.net),s.net>=0?'ok':'bad')+row('ربح الفرخة',N?(s.net/N).toFixed(2):'—')+row('ربح الكيلو',(s.net/s.sk).toFixed(2)):row('الصافي','لسه مفيش مبيعات')}</div></div>
<p class="mu">FCR = العلف المستهلك ÷ الكيلوات (الأساس: ${s.basis}). بيبقى أدق بعد بيع الدورة كلها. EPEF = (نسبة الحياة % × الوزن كجم) ÷ (العمر × FCR) × 100 — كل ما زاد أحسن.</p></div>`}
function cyc(c){const kg=c.tk||0;return {fcr:kg>0?c.feed/kg:0,ckg:kg>0?c.ex/kg:0,pb:c.ch?c.net/c.ch:0,mort:c.ch?c.dead/c.ch*100:0}}
function vCmp(){if(!S.cycles.length)return '<div class="card"><h2>مقارنة الدورات</h2><p class="mu">لسه مفيش دورات مقفولة.</p></div>';
 const L=S.cycles.map(c=>({c,k:cyc(c)})),ks=Object.keys(CAT),ch=(t,f,fm)=>`<div class="card"><h2>${t}</h2>${bars(L.map(o=>({l:o.c.nm,v:f(o)})),fm)}</div>`;
 return `<div class="card"><h2>مقارنة الدورات</h2><div class="sc"><table><tr><th>الدورة</th><th>من</th><th>إلى</th><th>كتاكيت</th><th>نافق%</th><th>FCR</th><th>تكلفة الكيلو</th><th>مصاريف</th><th>مبيعات</th><th>صافي</th><th>ربح/فرخة</th></tr>${L.map(o=>{const c=o.c,k=o.k;return `<tr><td>${esc(c.nm)}</td><td>${esc(c.from)}</td><td>${esc(c.to)}</td><td>${f0(c.ch)}</td><td>${k.mort.toFixed(1)}</td><td>${k.fcr?k.fcr.toFixed(2):'—'}</td><td>${k.ckg?k.ckg.toFixed(2):'—'}</td><td>${f0(c.ex)}</td><td>${f0(c.tm)}</td><td class="${c.net>=0?'ok':'bad'}">${f0(c.net)}</td><td>${k.pb.toFixed(2)}</td></tr>`}).join('')}</table></div></div>
<div class="cols">${ch('صافي الربح',o=>o.c.net,f0)}${ch('تكلفة الكيلو',o=>o.k.ckg,v=>v.toFixed(1))}${ch('معامل التحويل FCR',o=>o.k.fcr,v=>v.toFixed(2))}${ch('نسبة النافق %',o=>o.k.mort,v=>v.toFixed(1))}</div>
${L.some(o=>o.c.cb)?`<div class="card"><h2>تفنيد مصاريف الدورات</h2><div class="sc"><table><tr><th>الدورة</th>${ks.map(k=>`<th>${CAT[k][0]} ${CAT[k][1]}</th>`).join('')}</tr>${L.filter(o=>o.c.cb).map(o=>`<tr><td>${esc(o.c.nm)}</td>${ks.map(k=>`<td>${o.c.cb[k]?f0(o.c.cb[k]):'—'}</td>`).join('')}</tr>`).join('')}</table></div></div>`:''}
<button class="sec noprint" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>`}
function vCycles(){
return `${vRep()}${vBreak(1)}
<div class="cols noprint"><div class="card"><h2>قفل الدورة</h2><p class="mu">بتحفظ ملخص الدورة وتنزل نسخة احتياطية تلقائي، وتبدأ دورة جديدة. الأدوية بتفضل في المخزن، وباقي العلف ورصيد العاملين بيتنقلوا للدورة الجديدة.</p><label>اسم الدورة<input id="cn" placeholder="دورة ${S.cycles.length+1}"></label><button class="pri" onclick="closeCycle()">قفل الدورة وبدء جديدة</button></div>
<div class="card"><h2>نسخة احتياطية</h2><button class="sec" onclick="backup()">تحميل نسخة (JSON)</button> <button class="sec" onclick="csv()">تصدير الدورة الحالية (Excel)</button><h3>استرجاع نسخة</h3><input type="file" accept=".json" onchange="restore(this)"></div></div>
${vCmp()}`}

if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
</body>
