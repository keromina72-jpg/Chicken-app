<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مزرعة الفراخ</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--or:#e8731a;--od:#b9560a;--ol:#fff1e3;--bg:#fffaf5;--card:#fff;--tx:#2b2118;--mu:#8a7767;--bd:#f1dfcf;--ok:#2e8b57;--bad:#c62828;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;padding-top:env(safe-area-inset-top,0px)}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:#fff;border-left:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:20px;color:var(--od);padding:4px 10px 16px}
#nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;margin-bottom:4px;border:0;border-radius:12px;background:none;color:var(--tx);font:inherit;text-align:right;cursor:pointer}
#nav button.on{background:var(--ol);color:var(--od);font-weight:800}
#nav b{font-size:20px}
main{padding:16px;max-width:1040px;width:100%;margin:auto}
#hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
#hd h1{margin:0;font-size:20px;font-weight:800;color:var(--od)}
.pill{background:var(--ol);color:var(--od);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600}
h2{font-size:17px;margin:0 0 10px;font-weight:800}h3{font-size:15px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(185,86,10,.06)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
input,select{padding:10px;border-radius:10px;border:1px solid var(--bd);background:#fff;color:var(--tx);font:inherit;width:100%}
input:focus,select:focus{outline:2px solid var(--or);border-color:var(--or)}
button{font:inherit;cursor:pointer}
.pri{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,#f58a2e,var(--or));color:#fff;font-weight:800}
.sec{margin-top:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--or);background:#fff;color:var(--od);font-weight:600}
.x{border:0;background:none;color:var(--bad);font-size:16px}
.r{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600;background:var(--bg)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mu{color:var(--mu)}
.hi{background:var(--ol);font-weight:800}
.big{font-size:22px;font-weight:800;color:var(--od);margin:4px 0}
.al{padding:10px 12px;border-radius:10px;margin-bottom:6px;font-size:14px;background:#f8f4ef}
.al.w{background:var(--ol);border-right:4px solid var(--or)}
.bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin-top:4px;width:100%}.bar i{display:block;height:100%;background:var(--or)}
#toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:9}
body.lo aside,body.lo #hd{display:none}body.lo #app{grid-template-columns:1fr}
@media(max-width:820px){
 #app{grid-template-columns:1fr}
 aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:5;border:0;border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
 .brand{display:none}#nav{display:flex}
 #nav button{flex-direction:column;gap:0;font-size:11px;padding:6px 2px;margin:0;text-align:center;justify-content:center}
 main{padding:12px 12px 96px}
 .cols{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
<aside><div class="brand">🐔 مزرعة الفراخ</div><div id="nav"></div></aside>
<main><div id="hd"></div><div id="view"></div></main>
</div>
<div id="toast"></div>
<script>
/* ===== إعداد Firebase: الصق apiKey و appId من موقع الخرفان (نفس المشروع) =====
   لو apiKey فاضي الموقع بيشتغل محلي على نفس الجهاز بس (وضع تجريبي). */
const FB={apiKey:'AIzaSyAruaVgbRKXd3GG4FHqHD7ZrW6Oe6vUhnA',authDomain:'chicken-app-7f146.firebaseapp.com',projectId:'chicken-app-7f146',appId:'1:604227682076:web:3fa11e1bae5a882ad4c4d9'};
const CLOUD=!!FB.apiKey;

/* جدول الاستاندر: الوطنية مصر - روس، يوم 0 إلى 45 */
const W=[44,62,81,102,125,151,181,213,249,288,330,376,425,477,533,592,655,720,789,860,935,1012,1092,1174,1258,1345,1434,1524,1616,1710,1805,1901,1999,2097,2196,2296,2396,2496,2597,2697,2798,2898,2998,3097,3197,3295];
const C=[0,12,28,48,72,100,131,166,206,249,297,349,406,468,535,608,685,768,856,950,1050,1155,1266,1383,1505,1633,1767,1907,2051,2202,2357,2518,2684,2855,3031,3211,3396,3584,3777,3974,4175,4379,4586,4797,5010,5226];
/* مواعيد التحصين إرشادية، اتبع برنامج الدكتور البيطري */
const VAC=[[5,'هتشنر + IB'],[12,'جمبورو'],[18,'جمبورو (تقوية)'],[21,'لاسوتا (نيوكاسل)']];
const SK=['days','meds','chicks'],PK=['exp','sales','pays','price','feedPrice','daily','feedBuy','cycles'];

let S={days:[],meds:[],chicks:0,exp:[],sales:[],pays:[],price:0,feedPrice:0,daily:0,feedBuy:[],cycles:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem('farm')||'{}'))}catch(e){}
let role='owner',tab='daily',auth,AU,db,fs,ref={};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseFloat(v)||0,f0=n=>Math.round(n).toLocaleString('en');
const today=()=>new Date().toISOString().slice(0,10);
const days=()=>S.days.slice().sort((a,b)=>a.n-b.n);
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const totExp=()=>sum(S.exp,x=>x.a);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}

/* ---------- الحفظ والمزامنة ---------- */
async function save(){
 try{localStorage.setItem('farm',JSON.stringify(S))}catch(e){}
 if(!db)return;
 const pick=ks=>Object.fromEntries(ks.map(k=>[k,S[k]]));
 try{await fs.setDoc(ref.sh,pick(SK),{merge:true});if(role=='owner')await fs.setDoc(ref.pr,pick(PK),{merge:true})}
 catch(e){toast('مشكلة في الحفظ: '+(e.code||e.message))}
}
const soft=()=>{const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName))return;render()};
function listen(){
 const on=r=>fs.onSnapshot(r,s=>{if(s.metadata.hasPendingWrites||!s.exists())return;Object.assign(S,s.data());soft()});
 on(ref.sh);if(role=='owner')on(ref.pr);
}
async function boot(){
 if(!CLOUD){render();return}
 const B='https://www.gstatic.com/firebasejs/10.14.1/';
 const [a,au,f]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
 const app=a.initializeApp(FB);AU=au;fs=f;auth=au.getAuth(app);db=f.getFirestore(app);
 ref.sh=f.doc(db,'poultry','shared');ref.pr=f.doc(db,'poultry','private');
 au.onAuthStateChanged(auth,async u=>{
  if(!u)return login();
  try{const r=await f.getDoc(f.doc(db,'users',u.uid));if(!r.exists())return login('الحساب ده لسه متفعّلش، كلم المالك');role=r.data().role=='owner'?'owner':'worker'}
  catch(e){return login('مشكلة في الصلاحيات')}
  listen();render();
 });
}
function login(msg){
 document.body.classList.add('lo');
 $('#view').innerHTML=`<div class="card" style="max-width:380px;margin:40px auto"><h2>🐔 دخول</h2>${msg?`<p class="bad">${msg}</p>`:''}<label>الإيميل<input id="le" type="email"></label><label style="margin-top:8px">الرقم السري<input id="lp" type="password"></label><button class="pri" onclick="doLogin()">دخول</button></div>`}
async function doLogin(){try{await AU.signInWithEmailAndPassword(auth,$('#le').value.trim(),$('#lp').value)}catch(e){toast('الإيميل أو الرقم السري غلط')}}
function logout(){AU.signOut(auth)}

/* ---------- الهيكل ---------- */
function go(t){tab=t;render()}
function render(){
 document.body.classList.remove('lo');
 const own=role=='owner';
 const tabs=[['daily','📝','اليومية'],['table','📊','الجدول'],['stock','💊','المخزن']].concat(own?[['exp','💰','المصاريف'],['sales','🧾','المبيعات'],['cycles','🔁','الدورات']]:[]);
 if(!tabs.some(t=>t[0]==tab))tab='daily';
 $('#nav').innerHTML=tabs.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('');
 $('#hd').innerHTML=`<h1>${tabs.find(t=>t[0]==tab)[2]}</h1><div><span class="pill">${CLOUD?(own?'مالك':'عامل'):'وضع تجريبي (محلي)'}</span>${CLOUD?' <button class="sec" style="margin:0" onclick="logout()">خروج</button>':''}</div>`;
 $('#view').innerHTML=({daily:vDaily,table:vTable,exp:vExp,sales:vSales,stock:vStock,cycles:vCycles})[tab]();
 scrollTo(0,0);
}

/* ---------- التنبيهات ---------- */
function feedLeft(){if(!S.feedBuy.length)return null;const left=sum(S.feedBuy,x=>x.k)-sum(S.days,e=>e.feed),r=days().slice(-3).filter(e=>e.feed),avg=r.length?sum(r,e=>e.feed)/r.length:0;return{left,days:avg?left/avg:99}}
function alerts(){
 const d=days(),A=[],L=d[d.length-1],cur=L?L.n+1:0;
 A.push(['i',`يوم ${cur}: العلف المناسب (${cur<=10?'بادئ':cur<=24?'نامي':'ناهي'}) — إرشادي حسب شركة العلف`]);
 if(cur==11||cur==25)A.push(['w',`النهاردة غيّر العلف لـ${cur==11?'نامي':'ناهي'}`]);
 if(cur==10||cur==24)A.push(['i',`بكرة تغيير العلف لـ${cur==10?'نامي':'ناهي'}`]);
 VAC.forEach(([v,n])=>{const x=v-cur;if(d.some(e=>e.v&&e.v.includes(n)))return;if(x==0)A.push(['w','تحصين النهاردة: '+n]);else if(x>0&&x<=2)A.push(['i',`تحصين ${n} بعد ${x} يوم`])});
 if(L&&S.chicks){
  const td=sum(d,e=>e.dead),alive=S.chicks-td,pv=d.slice(0,-1),av=pv.length?sum(pv,e=>e.dead)/pv.length:0,r=L.dead/(alive+L.dead);
  if(L.dead>0&&(r>.003||(L.dead>=3&&L.dead>2*av)))A.push(['w',`نافق يوم ${L.n} مرتفع: ${L.dead} (${(r*100).toFixed(2)}%) — شوف السبب`]);
  if(L.n>=2&&L.n<=45&&L.feed){const g=L.feed*1000/alive,sd=C[L.n]-C[L.n-1],dv=(g-sd)/sd;if(Math.abs(dv)>.15)A.push(['w',`علف يوم ${L.n}: ${f0(g)} جم/فرخة مقابل ${sd} استاندر (${dv>0?'+':''}${(dv*100).toFixed(0)}%)`])}
  if(L.w&&W[L.n]){const dv=(L.w-W[L.n])/W[L.n];if(dv<-.05)A.push(['w',`وزنك أقل من الاستاندر بـ ${(-dv*100).toFixed(0)}%`])}
 }
 const fl=feedLeft();if(fl&&fl.days<3)A.push(['w',`العلف هيخلص بعد ~${fl.days.toFixed(1)} يوم (باقي ${f0(fl.left)} كجم)`]);
 S.meds.filter(m=>m.left<=m.q0*.2).forEach(m=>A.push(['w','دوا قليل: '+m.name]));
 return A}

/* ---------- اليومية ---------- */
const medRow=()=>`<div class="r mr"><select>${S.meds.map(m=>`<option value="${m.id}">${esc(m.name)} (${f0(m.left)} ${m.u})</option>`).join('')}</select><input type="number" step="any" inputmode="decimal" placeholder="الكمية"></div>`;
function addMed(){$('#meds').insertAdjacentHTML('beforeend',medRow())}
function vDaily(){const d=days(),n=d.length?d[d.length-1].n+1:0;
return `<div class="cols"><div class="card"><h2>تسجيل اليوم</h2><div class="g">
<label>اليوم في الدورة<input id="fn" type="number" value="${n}"></label>
<label>التاريخ<input id="fd" type="date" value="${today()}"></label>
${S.chicks?'':'<label>عدد الكتاكيت<input id="fc" type="number" inputmode="numeric"></label>'}
<label>العلف (كجم)<input id="ff" type="number" step="any" inputmode="decimal"></label>
<label>النافق<input id="fx" type="number" inputmode="numeric"></label>
<label>متوسط الوزن (جم) لو وزنت<input id="fw" type="number" step="any" inputmode="decimal"></label>
<label>تحصين النهاردة (لو حصنت)<input id="fv" list="vl" placeholder="مثلاً: جمبورو"></label><datalist id="vl">${VAC.map(v=>`<option value="${v[1]}">`).join('')}</datalist></div>
<h3>الأدوية</h3><div id="meds">${S.meds.length?medRow():'<p class="mu">مفيش أدوية في المخزن.</p>'}</div>
${S.meds.length?'<button class="sec" onclick="addMed()">+ دوا تاني</button>':''}
<button class="pri" onclick="saveDay()">حفظ اليوم</button></div>
<div class="card"><h2>تنبيهات</h2>${alerts().map(a=>`<div class="al ${a[0]}">${a[0]=='w'?'⚠️ ':''}${esc(a[1])}</div>`).join('')}</div></div>`}
function rm(n){const o=S.days.find(x=>x.n==n);if(o){o.meds.forEach(a=>{const m=S.meds.find(x=>x.id==a.id);if(m)m.left+=a.q});S.days=S.days.filter(x=>x!==o)}}
function saveDay(){const n=parseInt($('#fn').value);if(isNaN(n)||n<0)return toast('اكتب رقم اليوم');
 if($('#fc'))S.chicks=num($('#fc').value);if(!S.chicks)return toast('اكتب عدد الكتاكيت');
 const meds=[];document.querySelectorAll('.mr').forEach(r=>{const q=num(r.querySelector('input').value),m=S.meds.find(x=>x.id==r.querySelector('select').value);if(m&&q>0){m.left=Math.max(0,m.left-q);meds.push({id:m.id,name:m.name,q,u:m.u})}});
 rm(n);S.days.push({n,date:$('#fd').value||today(),feed:num($('#ff').value),dead:num($('#fx').value),w:num($('#fw').value),v:$('#fv').value.trim(),meds});
 save();toast('تم الحفظ ✓');go('table')}
function delDay(n){rm(n);save();render()}

/* ---------- الجدول والرسم والمقارنة ---------- */
function chart(d){const pts=d.filter(e=>e.w),X=n=>40+n/45*540,Y=w=>230-w/3400*210;
 let g='';[0,1000,2000,3000].forEach(v=>g+=`<line x1="40" x2="580" y1="${Y(v)}" y2="${Y(v)}" stroke="#f1dfcf"/><text x="34" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#8a7767">${v}</text>`);
 [0,10,20,30,40].forEach(n=>g+=`<text x="${X(n)}" y="248" text-anchor="middle" font-size="10" fill="#8a7767">${n}</text>`);
 return `<svg viewBox="0 0 600 255" style="width:100%;direction:ltr">${g}<polyline points="${W.map((w,i)=>X(i)+','+Y(w)).join(' ')}" fill="none" stroke="#b8a898" stroke-width="2" stroke-dasharray="5 4"/>${pts.length?`<polyline points="${pts.map(e=>X(e.n)+','+Y(e.w)).join(' ')}" fill="none" stroke="#e8731a" stroke-width="3"/>`+pts.map(e=>`<circle cx="${X(e.n)}" cy="${Y(e.w)}" r="3.5" fill="#e8731a"/>`).join(''):''}</svg><p class="mu"><b style="color:#e8731a">━</b> وزنك &nbsp; <b>┅</b> الاستاندر (جم، حسب يوم الدورة)</p>`}
function vTable(){const d=days();if(!d.length)return '<div class="card"><p class="mu">لسه مفيش تسجيلات. سجّل أول يوم من تبويب اليومية.</p></div>';
 let dead=0,feed=0;const own=role=='owner';
 const rows=d.map(e=>{dead+=e.dead;feed+=e.feed;e.alive=S.chicks-dead;e.cf=feed;
  const g=e.feed*1000/e.alive,sd=e.n>=1&&e.n<=45?C[e.n]-C[e.n-1]:0,off=sd&&e.feed&&Math.abs(g-sd)/sd>.15;
  return `<tr><td>${e.n}</td><td>${esc(e.date)}</td><td>${e.feed||''}</td><td class="${off?'bad':''}">${e.feed?f0(g):''}</td><td>${e.dead||''}</td><td>${f0(e.alive)}</td><td style="white-space:normal">${e.meds.map(a=>esc(a.name)+' '+a.q+' '+a.u).join('، ')}</td><td style="white-space:normal">${esc(e.v||'')}</td><td>${e.w||''}</td>${own?`<td><button class="x" onclick="delDay(${e.n})">✕</button></td>`:''}</tr>`}).join('');
 const cmp=d.filter(e=>e.w&&W[e.n]).map(e=>{const df=e.w-W[e.n],pc=df/W[e.n]*100,fb=e.cf*1000/e.alive,fa=fb/e.w,fs_=C[e.n]/W[e.n];
  return `<tr><td>${e.n}</td><td>${e.w}</td><td>${W[e.n]}</td><td class="${df>=0?'ok':'bad'}">${df>0?'+':''}${f0(df)} (${pc.toFixed(1)}%)</td><td>${f0(fb)}</td><td>${C[e.n]}</td><td class="${fa<=fs_?'ok':'bad'}">${fa.toFixed(2)}</td><td>${fs_.toFixed(2)}</td></tr>`}).join('');
 return `<div class="card"><h2>الوزن مقابل الاستاندر</h2>${chart(d)}</div>
<div class="card"><h2>الجدول الكبير</h2><p class="mu">إجمالي النافق: ${f0(dead)} (${(dead/S.chicks*100).toFixed(1)}%) — المتبقي: ${f0(S.chicks-dead)} — الأحمر في علف/فرخة = فرق أكتر من 15% عن الاستاندر</p>
<div class="sc"><table><tr><th>يوم</th><th>تاريخ</th><th>علف كجم</th><th>علف/فرخة جم</th><th>نافق</th><th>متبقي</th><th>أدوية</th><th>تحصين</th><th>وزن جم</th>${own?'<th></th>':''}</tr>${rows}</table></div></div>
<div class="card"><h2>المقارنة بجدول الاستاندر</h2>${cmp?`<div class="sc"><table><tr><th>يوم</th><th>وزنك</th><th>الاستاندر</th><th>الفرق</th><th>علف/فرخة (جم)</th><th>استاندر</th><th>FCR</th><th>FCR استاندر</th></tr>${cmp}</table></div><p class="mu">علف الفرخة وFCR تقريبيين من العلف المسجل وعدد الفراخ الحية.</p>`:'<p class="mu">سجل وزن في أي يوم عشان تظهر المقارنة.</p>'}</div>`}

/* ---------- المصاريف والتوصية ---------- */
function addExp(){const a=num($('#ea').value),n=$('#en').value.trim();if(!n||!a)return toast('اكتب البند والمبلغ');S.exp.push({n,a,d:$('#ed').value||today()});save();render()}
function delExp(i){S.exp.splice(i,1);save();render()}
function setS(k,v){S[k]=num(v);save();render()}
function vExp(){const t=totExp();
return `<div class="cols"><div><div class="card"><h2>المصاريف</h2><div class="g"><label>البند<input id="en"></label><label>المبلغ<input id="ea" type="number" step="any" inputmode="decimal"></label><label>التاريخ<input id="ed" type="date" value="${today()}"></label></div><button class="pri" onclick="addExp()">إضافة</button>
${S.exp.map((x,i)=>`<div class="li"><span>${esc(x.n)} <small class="mu">${esc(x.d||'')}</small></span><b>${f0(x.a)}</b><button class="x" onclick="delExp(${i})">✕</button></div>`).join('')}
<div class="li"><b>الإجمالي</b><b>${f0(t)}</b></div></div>
<div class="card"><h2>الأسعار</h2><div class="g">
<label>سعر كيلو الفراخ المتوقع<input type="number" step="any" inputmode="decimal" value="${S.price||''}" onchange="setS('price',this.value)"></label>
<label>سعر كيلو العلف<input type="number" step="any" inputmode="decimal" value="${S.feedPrice||''}" onchange="setS('feedPrice',this.value)"></label>
<label>مصاريف يومية إضافية (كهربا، عمالة)<input type="number" step="any" inputmode="decimal" value="${S.daily||''}" onchange="setS('daily',this.value)"></label></div></div></div>${rec(t)}</div>`}
function rec(t){const d=days();if(!d.length||!S.price)return '<div class="card"><p class="mu">اكتب سعر الكيلو المتوقع وسجل يوم على الأقل عشان تظهر توصية البيع.</p></div>';
 const N=S.chicks-sum(d,e=>e.dead),n=Math.min(d[d.length-1].n,45),lw=[...d].reverse().find(e=>e.w&&W[e.n]),r=lw?lw.w/W[lw.n]:1;
 let best=-1e15,bd=n;const out=[];
 for(let x=n;x<=45;x++){const w=W[x]*r,rev=N*w/1000*S.price,cost=t+(C[x]-C[n])*N/1000*S.feedPrice+(x-n)*S.daily;out.push({x,w,rev,cost,p:rev-cost});if(rev-cost>best){best=rev-cost;bd=x}}
 const b=out.find(o=>o.x==bd),be=t/(N*S.price)*1000;
 return `<div class="card"><h2>أنسب وقت للبيع</h2><div class="big">يوم ${bd} — وزن ${f0(b.w)} جم</div>
<p class="mu">ربح متوقع: ${f0(b.p)} — الوزن اللي بيغطي مصاريفك: ${f0(be)} جم للفرخة (على ${f0(N)} فرخة).</p>
${S.feedPrice?'':'<p class="bad">اكتب سعر كيلو العلف عشان الحساب يبقى دقيق.</p>'}
<div class="sc"><table><tr><th>يوم</th><th>وزن جم</th><th>إيراد</th><th>تكلفة</th><th>ربح</th></tr>${out.map(o=>`<tr class="${o.x==bd?'hi':''}"><td>${o.x}</td><td>${f0(o.w)}</td><td>${f0(o.rev)}</td><td>${f0(o.cost)}</td><td>${f0(o.p)}</td></tr>`).join('')}</table></div>
<p class="mu">الوزن المتوقع = الاستاندر × نسبة وزنك لآخر وزنة سجلتها.</p></div>`}

/* ---------- المبيعات والعملاء ---------- */
function custs(){const c={};const g=t=>c[t]=c[t]||{k:0,m:0,p:0};
 S.sales.forEach(x=>{const o=g(x.t||'بدون اسم');o.k+=x.k;o.m+=x.k*x.p;o.p+=x.paid||0});S.pays.forEach(x=>{g(x.t||'بدون اسم').p+=x.a});return c}
function addSale(){const k=num($('#sk').value),p=num($('#sp').value);if(!k||!p)return toast('اكتب الوزن والسعر');
 S.sales.push({t:$('#st').value.trim(),c:num($('#sc').value),k,p,paid:num($('#spd').value),d:$('#sd').value||today()});save();render()}
function addPay(){const a=num($('#pa').value);if(!a)return toast('اكتب المبلغ');S.pays.push({t:$('#pt').value.trim(),a,d:$('#pd').value||today()});save();render()}
function delSale(i){S.sales.splice(i,1);save();render()}
function delPay(i){S.pays.splice(i,1);save();render()}
function vSales(){const tk=sum(S.sales,x=>x.k),tm=sum(S.sales,x=>x.k*x.p),net=tm-totExp(),c=custs(),nm=Object.keys(c);
return `<datalist id="cl">${nm.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
<div class="cols"><div><div class="card"><h2>تسجيل بيعة</h2><div class="g"><label>اسم التاجر<input id="st" list="cl"></label><label>عدد الفراخ<input id="sc" type="number" inputmode="numeric"></label><label>وزن الوزنة (كجم)<input id="sk" type="number" step="any" inputmode="decimal"></label><label>سعر الكيلو<input id="sp" type="number" step="any" inputmode="decimal"></label><label>المدفوع<input id="spd" type="number" step="any" inputmode="decimal"></label><label>التاريخ<input id="sd" type="date" value="${today()}"></label></div><button class="pri" onclick="addSale()">تسجيل البيعة</button>
${S.sales.map((x,i)=>`<div class="li"><span><small class="mu">${esc(x.d||'')}</small> ${esc(x.t)} ${x.c?x.c+' فرخة — ':''}${x.k} كجم × ${x.p}</span><b>${f0(x.k*x.p)}</b><button class="x" onclick="delSale(${i})">✕</button></div>`).join('')}
<div class="li"><span>إجمالي الكيلوات</span><b>${f0(tk)}</b></div><div class="li"><span>إجمالي المبيعات</span><b>${f0(tm)}</b></div>
<div class="li"><span>الصافي بعد المصاريف</span><b class="${net>=0?'ok':'bad'}">${f0(net)}</b></div></div></div>
<div><div class="card"><h2>حساب العملاء</h2>${nm.length?`<div class="sc"><table><tr><th>التاجر</th><th>كجم</th><th>الإجمالي</th><th>المدفوع</th><th>عليه</th></tr>${nm.map(n=>{const o=c[n],r=o.m-o.p;return `<tr><td>${esc(n)}</td><td>${f0(o.k)}</td><td>${f0(o.m)}</td><td>${f0(o.p)}</td><td class="${r>0.5?'bad':'ok'}">${f0(r)}</td></tr>`}).join('')}</table></div>`:'<p class="mu">لسه مفيش مبيعات.</p>'}</div>
<div class="card"><h2>تسجيل دفعة من تاجر</h2><div class="g"><label>التاجر<input id="pt" list="cl"></label><label>المبلغ<input id="pa" type="number" step="any" inputmode="decimal"></label><label>التاريخ<input id="pd" type="date" value="${today()}"></label></div><button class="pri" onclick="addPay()">تسجيل الدفعة</button>
${S.pays.map((x,i)=>`<div class="li"><span><small class="mu">${esc(x.d||'')}</small> ${esc(x.t)}</span><b>${f0(x.a)}</b><button class="x" onclick="delPay(${i})">✕</button></div>`).join('')}</div></div></div>`}

/* ---------- المخزن: أدوية وعلف ---------- */
function addStock(){const name=$('#mn').value.trim(),q=num($('#mq').value);if(!name||!q)return toast('اكتب الاسم والكمية');S.meds.push({id:String(Date.now()),name,q0:q,left:q,u:$('#mu').value,d:$('#md').value||today()});save();render()}
function delStock(i){S.meds.splice(i,1);save();render()}
function addFeed(){const k=num($('#bk').value);if(!k)return toast('اكتب كمية العلف');S.feedBuy.push({k,d:$('#bd').value||today()});save();render()}
function delFeed(i){S.feedBuy.splice(i,1);save();render()}
function vStock(){const fl=feedLeft();
return `<div class="cols"><div class="card"><h2>مخزن الأدوية</h2><div class="g"><label>اسم الدوا<input id="mn"></label><label>الكمية<input id="mq" type="number" step="any" inputmode="decimal"></label><label>الوحدة<select id="mu"><option>مل</option><option>جرام</option></select></label><label>تاريخ الشراء<input id="md" type="date" value="${today()}"></label></div><button class="pri" onclick="addStock()">إضافة للمخزن</button>
${S.meds.map((m,i)=>`<div class="li" style="flex-wrap:wrap"><span>${esc(m.name)} <small class="mu">${esc(m.d||'')}</small></span><b class="${m.left<=m.q0*.2?'bad':''}">${f0(m.left)} / ${f0(m.q0)} ${m.u}</b><button class="x" onclick="delStock(${i})">✕</button><div class="bar"><i style="width:${Math.max(0,m.left/m.q0*100)}%"></i></div></div>`).join('')}
<p class="mu">الأحمر = باقي أقل من 20%. الكمية بتتخصم تلقائي من اليومية.</p></div>
${role=='owner'?`<div class="card"><h2>رصيد العلف</h2><div class="g"><label>علف اشتريته (كجم)<input id="bk" type="number" step="any" inputmode="decimal"></label><label>التاريخ<input id="bd" type="date" value="${today()}"></label></div><button class="pri" onclick="addFeed()">إضافة علف</button>
${S.feedBuy.map((x,i)=>`<div class="li"><span><small class="mu">${esc(x.d||'')}</small> شراء علف</span><b>${f0(x.k)} كجم</b><button class="x" onclick="delFeed(${i})">✕</button></div>`).join('')}
${fl?`<div class="big">باقي ${f0(fl.left)} كجم</div><p class="${fl.days<3?'bad':'mu'}">يكفي حوالي ${fl.days>=99?'—':fl.days.toFixed(1)} يوم على آخر استهلاك مسجل.</p>`:'<p class="mu">سجل العلف اللي اشتريته عشان يتحسب الباقي والأيام.</p>'}</div>`:''}</div>`}

/* ---------- الدورات والنسخ الاحتياطي ---------- */
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function backup(){dl('farm-backup-'+today()+'.json',JSON.stringify(S),'application/json')}
function csv(){let dead=0;const rows=[['يوم','تاريخ','علف كجم','نافق','متبقي','وزن جم','أدوية','تحصين']].concat(days().map(e=>{dead+=e.dead;return [e.n,e.date,e.feed,e.dead,S.chicks-dead,e.w||'',e.meds.map(a=>a.name+' '+a.q+' '+a.u).join(' + '),e.v||'']}));
 dl('farm-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{Object.assign(S,JSON.parse(r.result));save();render();toast('تم الاسترجاع ✓')}catch(e){toast('الملف غلط')}};r.readAsText(f)}
function closeCycle(){const d=days();if(!d.length)return toast('مفيش دورة تتقفل');
 const owed=sum(Object.values(custs()),o=>o.m-o.p);if(owed>0.5)return toast('لسه فيه فلوس على تجار: '+f0(owed));
 const nm=$('#cn').value.trim()||('دورة '+(S.cycles.length+1)),dead=sum(d,e=>e.dead),ex=totExp(),tm=sum(S.sales,x=>x.k*x.p),fl=feedLeft();
 backup();
 S.cycles.push({nm,from:d[0].date,to:d[d.length-1].date,ch:S.chicks,dead,feed:sum(d,e=>e.feed),ex,tk:sum(S.sales,x=>x.k),tm,net:tm-ex});
 S.days=[];S.exp=[];S.sales=[];S.pays=[];S.chicks=0;S.feedBuy=fl&&fl.left>0?[{k:fl.left,d:today()}]:[];
 save();toast('اتقفلت ✓ ونزلت نسخة احتياطية');render()}
function vCycles(){
return `<div class="cols"><div class="card"><h2>قفل الدورة</h2><p class="mu">بتحفظ ملخص الدورة وتنزل نسخة احتياطية تلقائي، وتبدأ دورة جديدة. الأدوية بتفضل في المخزن، وباقي العلف بيتنقل للدورة الجديدة.</p><label>اسم الدورة<input id="cn" placeholder="دورة ${S.cycles.length+1}"></label><button class="pri" onclick="closeCycle()">قفل الدورة وبدء جديدة</button></div>
<div class="card"><h2>نسخة احتياطية</h2><button class="sec" onclick="backup()">تحميل نسخة (JSON)</button> <button class="sec" onclick="csv()">تصدير الدورة الحالية (Excel)</button><h3>استرجاع نسخة</h3><input type="file" accept=".json" onchange="restore(this)"></div></div>
<div class="card"><h2>مقارنة الدورات</h2>${S.cycles.length?`<div class="sc"><table><tr><th>الدورة</th><th>من</th><th>إلى</th><th>كتاكيت</th><th>نافق%</th><th>علف كجم</th><th>مصاريف</th><th>مبيعات</th><th>صافي</th></tr>${S.cycles.map(c=>`<tr><td>${esc(c.nm)}</td><td>${esc(c.from)}</td><td>${esc(c.to)}</td><td>${f0(c.ch)}</td><td>${(c.dead/c.ch*100).toFixed(1)}</td><td>${f0(c.feed)}</td><td>${f0(c.ex)}</td><td>${f0(c.tm)}</td><td class="${c.net>=0?'ok':'bad'}">${f0(c.net)}</td></tr>`).join('')}</table></div>`:'<p class="mu">لسه مفيش دورات مقفولة.</p>'}</div>`}

boot();
</script>
</body>
</html>
