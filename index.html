   لو apiKey فاضي الموقع بيشتغل محلي على نفس الجهاز بس (وضع تجريبي). */
const FB={apiKey:'AIzaSyAruaVgbRKXd3GG4FHqHD7ZrW6Oe6vUhnA',authDomain:'chicken-app-7f146.firebaseapp.com',projectId:'chicken-app-7f146',appId:'1:604227682076:web:3fa11e1bae5a882ad4c4d9'};

/* جدول الاستاندر: الوطنية مصر - روس، يوم 0 إلى 45 */

const VAC=[[5,'هتشنر + IB'],[12,'جمبورو'],[18,'جمبورو (تقوية)'],[21,'لاسوتا (نيوكاسل)']];
const SK=['days','meds','chicks','vp','fk','cfg','mp','feedBuy','wg'],PK=['exp','sales','pays','price','feedPrice','daily','cycles','wk','wl','ph','rest'];

let S={days:[],wg:[],meds:[],chicks:0,exp:[],sales:[],pays:[],price:0,feedPrice:0,daily:0,feedBuy:[],cycles:[],wk:[],wl:[],vp:null,fk:null,ph:{},cfg:{},mp:[],rest:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem('farm')||'{}'))}catch(e){}
let role='owner',tab='home',auth,AU,db,fs,ref={};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseFloat(v)||0,f0=n=>Math.round(n).toLocaleString('en');
const today=()=>new Date().toISOString().slice(0,10);
const days=()=>S.days.slice().sort((a,b)=>a.n-b.n);
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const totExp=()=>sum(S.exp,x=>x.a)+laborDue();

/* ---------- الحفظ والمزامنة ---------- */
let SYNC={},_big=false,_fbd=false,OFFLINE=false;
const jk=k=>JSON.stringify(S[k]===undefined?null:S[k]);
async function save(){
 try{localStorage.setItem('farm',JSON.stringify(S))}catch(e){}
 if(OFFLINE){toast('📴 أوفلاين — التعديل ده مش هيتحفظ على السيرفر. ارجع للنت وكرره.',5000);return false}
 if(!db)return;
 if(!_big){const n=JSON.stringify(S).length;if(n>700000){_big=true;toast('⚠️ حجم البيانات كبير ('+Math.round(n/1024)+' ك) وقرّب يوصل لحد Firebase. اقفل الدورة وخد نسخة احتياطية.',9000)}}
 const pick=ks=>JSON.parse(JSON.stringify(Object.fromEntries(ks.map(k=>[k,S[k]===undefined?null:S[k]]))));
 const ds=SK.filter(k=>jk(k)!==SYNC[k]),dp=role=='owner'?PK.filter(k=>jk(k)!==SYNC[k]):[],sent={};
 [...ds,...dp].forEach(k=>sent[k]=jk(k));
 try{
  if(ds.length)await fs.setDoc(ref.sh,pick(ds),{merge:true});
  if(role=='owner'&&(dp.length||!_fbd)){await fs.setDoc(ref.pr,{...pick(dp),feedBuy:fs.deleteField()},{merge:true});_fbd=true}
  Object.assign(SYNC,sent);
 }catch(e){console.error(e);toast('مشكلة في الحفظ: '+(e.code||e.message),6000);return false}
 return true
}
const soft=()=>{const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;render()};
function listen(){
 let shReady=false,pendFB=null;
 const key=x=>(x.d||'')+'|'+x.t+'|'+x.k;
 const mig=()=>{if(!shReady||!pendFB)return;const old=pendFB;pendFB=null;S.feedBuy=S.feedBuy||[];const have=new Set(S.feedBuy.map(key));old.forEach(x=>{if(!have.has(key(x)))S.feedBuy.push(x)});save();soft()};
 /* لو عندك تعديل لسه ماتحفظش على قسم معين، التحديث القادم من السيرفر مايمسحوش */
 const apply=d=>{for(const k of Object.keys(d)){if(SYNC[k]!==undefined&&jk(k)!==SYNC[k])continue;S[k]=d[k];SYNC[k]=jk(k)}};
 fs.onSnapshot(ref.sh,s=>{if(s.metadata.hasPendingWrites)return;shReady=true;if(s.exists())apply(s.data());mig();soft()});
 if(role=='owner')fs.onSnapshot(ref.pr,s=>{if(s.metadata.hasPendingWrites||!s.exists())return;const D={...s.data()};if(Array.isArray(D.feedBuy)){pendFB=D.feedBuy}delete D.feedBuy;apply(D);mig();soft()});
}
async function boot(){
 if(!CLOUD){render();return}
 const B='https://www.gstatic.com/firebasejs/10.14.1/';
 let a,au,f;try{[a,au,f]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')])}catch(e){return offlineLocal()}
 const app=a.initializeApp(FB);AU=au;fs=f;auth=au.getAuth(app);db=f.getFirestore(app);
 ref.sh=f.doc(db,'poultry','shared');ref.pr=f.doc(db,'poultry','private');
 au.onAuthStateChanged(auth,async u=>{
  if(!u)return login();
  try{const r=await f.getDoc(f.doc(db,'users',u.uid));if(!r.exists())return login('الحساب ده لسه متفعّلش، كلم المالك');role=r.data().role=='owner'?'owner':'worker';try{localStorage.setItem('farmRole',role)}catch(e){}}

 });
